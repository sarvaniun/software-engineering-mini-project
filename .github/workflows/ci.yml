
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:            # keep this name: branch protection requires the "build-and-test" check
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run unit & API tests (Jest) with coverage
        run: >
          npx jest --ci --verbose
          --coverage --collectCoverageFrom='src/**/*.js'
          --coverageReporters=text --coverageReporters=json-summary --coverageReporters=html
          --json --outputFile=test-results.json

      - name: Publish test summary
        if: always()
        run: node scripts/test-summary.js test-results.json coverage/coverage-summary.json

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            test-results.json
            coverage/
