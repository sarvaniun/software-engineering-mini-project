<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faculty · Student Record System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-role="faculty">
  <header class="topbar">
    <h1>Faculty Dashboard</h1>
    <div><span class="who" id="user-name"></span><button class="btn-secondary" id="logout">Logout</button></div>
  </header>
  <main>
    <section class="panel" id="attendance-panel">
      <h2>Mark Attendance</h2>
      <p class="placeholder">Attendance for your classes: #14 (Yaseen)</p>
    </section>
    <section class="panel" id="marks-panel">
      <h2>Enter Marks</h2>
      <p class="placeholder">Marks for your subjects: #15 (Yaseen)</p>
    </section>
    <section class="panel" id="search-panel">
      <h2>Search Students</h2>
      <p class="placeholder">Search: #19 (Vinaayak)</p>
    </section>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
