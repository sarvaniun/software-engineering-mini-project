
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faculty Dashboard - Student Record System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body data-role="faculty">
  <header class="topbar">
    <h1>Faculty Dashboard</h1>
    <div>
      <span class="who" id="user-name"></span>
      <button class="btn-secondary" id="logout" type="button">Logout</button>
    </div>
  </header>

  <main>
    <!-- Issue #14: Attendance -->
    <section class="panel" id="attendance-panel">
      <h2>Mark Attendance</h2>

      <p id="attendance-status"
         class="placeholder"
         role="status"
         aria-live="polite">
        Loading your assigned subjects...
      </p>

      <form id="attendance-form" hidden>
        <label for="attendance-subject">Subject</label>
        <select id="attendance-subject" required>
          <option value="">Select a subject</option>
        </select>

        <label for="attendance-date">Class Date</label>
        <input id="attendance-date" type="date" required>

        <div id="attendance-students"></div>

        <button id="save-attendance"
                class="btn-primary"
                type="submit">
          Save Attendance
        </button>
      </form>
    </section>

    <!-- Issue #15: Marks entry and update -->
    <section class="panel" id="marks-panel">
      <h2>Enter Marks</h2>

      <p id="marks-status"
         class="placeholder"
         role="status"
         aria-live="polite">
        Loading your assigned subjects...
      </p>

      <form id="marks-form" hidden>
        <label for="marks-subject">Subject</label>
        <select id="marks-subject" required>
          <option value="">Select a subject</option>
        </select>

        <p id="marks-max-info"
           class="placeholder"
           aria-live="polite"></p>

        <div id="marks-students"></div>

        <button id="save-marks"
                class="btn-primary"
                type="submit">
          Save Marks
        </button>
      </form>
    </section>

    <!-- Student search is handled separately -->
    <section class="panel" id="search-panel">
      <h2>Search Students</h2>

      <input type="search" id="student-q" placeholder="Roll no or name">
      <select id="student-branch">
        <option value="">All branches</option>
        <option value="CSE">CSE</option>
        <option value="ECE">ECE</option>
      </select>
      <select id="student-semester">
        <option value="">All semesters</option>
        <option value="1">Semester 1</option>
        <option value="2">Semester 2</option>
        <option value="3">Semester 3</option>
        <option value="4">Semester 4</option>
        <option value="5">Semester 5</option>
        <option value="6">Semester 6</option>
        <option value="7">Semester 7</option>
        <option value="8">Semester 8</option>
      </select>

      <table>
        <thead>
          <tr>
            <th>Roll no</th>
            <th>Name</th>
            <th>Branch</th>
            <th>Sem</th>
          </tr>
        </thead>
        <tbody id="search-results"></tbody>
      </table>
      <p id="search-msg"></p>
    </section>
  </main>

  <!-- Shared authentication and API helpers -->
  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>

  <!-- Feature-specific scripts -->
  <script src="/js/attendance.js"></script>
  <script src="/js/marks.js"></script>
  <script src="/js/student-search.js"></script>
</body>
</html>
