<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · Student Record System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-role="admin">
  <header class="topbar">
    <h1>Admin Dashboard</h1>
    <div><span class="who" id="user-name"></span><button class="btn-secondary" id="logout">Logout</button></div>
  </header>
  <main>
    <section class="panel" id="add-student-panel">
      <h2>Add student</h2>
      <form id="add-student-form">
        <input name="roll_no" placeholder="Roll no" required>
        <input name="name" placeholder="Name" required>
        <input name="branch" placeholder="Branch" required>
        <input name="semester" type="number" min="1" max="8" placeholder="Semester" required>
        <input name="email" type="email" placeholder="Email">
        <input name="phone" placeholder="Phone">
        <button type="submit">Add student</button>
      </form>
      <p id="add-student-msg"></p>
    </section>
    <section class="panel" id="edit-student-panel">
      <h2>Edit student</h2>
      <form id="edit-student-form">
        <input name="id" placeholder="Student id" required>
        <input name="name" placeholder="Name">
        <input name="branch" placeholder="Branch">
        <input name="semester" type="number" min="1" max="8" placeholder="Semester">
        <input name="email" type="email" placeholder="Email">
        <input name="phone" placeholder="Phone">
        <button type="submit">Save changes</button>
      </form>
      <p id="edit-student-msg"></p>
    </section>
    <section class="panel" id="students-panel">
      <h2>Students</h2>
      <label><input type="checkbox" id="show-inactive"> Show inactive</label>
      <table id="students-table"><thead><tr><th>ID</th><th>Roll no</th><th>Name</th><th>Branch</th><th>Sem</th><th>Email</th><th>Phone</th><th>Status</th><th></th></tr></thead><tbody></tbody></table>
    </section>
    <section class="panel" id="reports-panel">
      <h2>Reports</h2>
      <p class="placeholder">Branch/class report: #27 (Eshwar)</p>
    </section>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
  <script>
    (async function () {
      const addForm = document.getElementById('add-student-form');
      const addMsg = document.getElementById('add-student-msg');
      const editForm = document.getElementById('edit-student-form');
      const editMsg = document.getElementById('edit-student-msg');
      const tbody = document.querySelector('#students-table tbody');
      let students = [];

      async function loadStudents() {
        try {
          const show = document.getElementById('show-inactive').checked;
          const res = await api('/students' + (show ? '?inactive=1' : ''));
          students = res.students || [];
          tbody.innerHTML = students.map(s =>
            `<tr><td>${s.id}</td><td>${s.roll_no}</td><td>${s.name}</td><td>${s.branch}</td><td>${s.semester}</td><td>${s.email || ''}</td><td>${s.phone || ''}</td><td>${s.is_active ? 'Active' : 'Inactive'}</td><td><button data-id="${s.id}" data-action="edit">Edit</button>${s.is_active ? ' <button data-id="${s.id}" data-action="deactivate">Deactivate</button>' : ''}</td></tr>`
          ).join('');
          tbody.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', async () => {
              const s = students.find(x => String(x.id) === btn.dataset.id);
              if (!s) return;
              if (btn.dataset.action === 'edit') {
                editForm.id.value = s.id;
                editForm.name.value = s.name || '';
                editForm.branch.value = s.branch || '';
                editForm.semester.value = s.semester || '';
                editForm.email.value = s.email || '';
                editForm.phone.value = s.phone || '';
                editMsg.textContent = 'Loaded student ' + s.roll_no;
              } else if (btn.dataset.action === 'deactivate') {
                try {
                  await api('/students/' + s.id + '/deactivate', { method: 'PATCH' });
                  addMsg.textContent = 'Student deactivated';
                  await loadStudents();
                } catch (e) { addMsg.textContent = e.message; }
              }
            });
          });
        } catch (e) { addMsg.textContent = e.message; }
      }

      document.getElementById('show-inactive').addEventListener('change', loadStudents);

      addForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        addMsg.textContent = '';
        const fd = new FormData(addForm);
        const data = Object.fromEntries(fd.entries());
        data.semester = Number(data.semester);
        try {
          await api('/students', { method: 'POST', body: JSON.stringify(data) });
          addMsg.textContent = 'Student added';
          addForm.reset();
          await loadStudents();
        } catch (e) {
          addMsg.textContent = e.message;
        }
      });

      editForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        editMsg.textContent = '';
        const fd = new FormData(editForm);
        const data = Object.fromEntries(fd.entries());
        const id = data.id;
        delete data.id;
        if (data.semester) data.semester = Number(data.semester);
        try {
          await api('/students/' + id, { method: 'PUT', body: JSON.stringify(data) });
          editMsg.textContent = 'Student updated';
          editForm.reset();
          await loadStudents();
        } catch (e) {
          editMsg.textContent = e.message;
        }
      });

      setTimeout(loadStudents, 0);
    })();
  </script>
</body>
</html>
