<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · Student Record System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-role="admin">
  <header class="topbar">
    <h1>Admin Dashboard</h1>
    <div><span class="who" id="user-name"></span><button class="btn-secondary" id="logout">Logout</button></div>
  </header>
  <main>
    <section class="panel" id="add-student-panel">
      <h2>Add student</h2>
      <form id="add-student-form">
        <input name="roll_no" placeholder="Roll no" required>
        <input name="name" placeholder="Name" required>
        <input name="branch" placeholder="Branch" required>
        <input name="semester" type="number" min="1" max="8" placeholder="Semester" required>
        <input name="email" type="email" placeholder="Email">
        <input name="phone" placeholder="Phone">
        <button type="submit">Add student</button>
      </form>
      <p id="add-student-msg"></p>
    </section>
    <section class="panel" id="students-panel">
      <h2>Students</h2>
      <table id="students-table"><thead><tr><th>Roll no</th><th>Name</th><th>Branch</th><th>Sem</th><th>Email</th><th>Phone</th></tr></thead><tbody></tbody></table>
    </section>
    <section class="panel" id="reports-panel">
      <h2>Reports</h2>
      <p class="placeholder">Branch/class report: #27 (Eshwar)</p>
    </section>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
  <script>
    (async function () {
      const form = document.getElementById('add-student-form');
      const msg = document.getElementById('add-student-msg');
      const tbody = document.querySelector('#students-table tbody');

      async function loadStudents() {
        try {
          const res = await api('/students');
          tbody.innerHTML = (res.students || []).map(s =>
            `<tr><td>${s.roll_no}</td><td>${s.name}</td><td>${s.branch}</td><td>${s.semester}</td><td>${s.email || ''}</td><td>${s.phone || ''}</td></tr>`
          ).join('');
        } catch (e) { msg.textContent = e.message; }
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = '';
        const fd = new FormData(form);
        const data = Object.fromEntries(fd.entries());
        data.semester = Number(data.semester);
        try {
          await api('/students', { method: 'POST', body: JSON.stringify(data) });
          msg.textContent = 'Student added';
          form.reset();
          await loadStudents();
        } catch (e) {
          msg.textContent = e.message;
        }
      });

      // load after dashboard guard; small delay to ensure token present
      setTimeout(loadStudents, 0);
    })();
  </script>
</body>
</html>
